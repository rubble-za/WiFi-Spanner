[package]
name = "wifispanner-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "wifispanner"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
wifispanner-scan = { path = "../wifispanner-scan" }
wifispanner-core = { path = "../wifispanner-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
hayro = { version = "0.8.0", features = ["embed-fonts"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.0"
sha2 = "0.11.1"
material-colors = "0.5.0"
egui_material_icons = "0.9.0"
damascene-fonts-roboto = "0.1.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
ocrs = "0.13"
rten = "0.26"
